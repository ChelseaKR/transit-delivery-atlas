# Scheduled full-history secret scan. A diff-scoped scan only ever sees the
# commits in a single push/PR; a secret committed further back in history and
# later removed would never trip it. This job walks the *entire* history weekly,
# reporting on all three of TruffleHog's result tiers, and fails loudly. The
# tier list is the point: a revoked credential is `unverified`, not `verified`
# (see the note on `extra_args` below).
name: secret-scan-scheduled

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-full-history:
    name: TruffleHog full-history scan (all result tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TruffleHog over the full git history
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          # `path` is what makes this a whole-repository scan. Omitting base and
          # head does NOT fall back to scanning everything, which is what the
          # previous comment here assumed: with all three unset the action
          # resolves base and head to the same commit and exits 1 on its own
          # guard, "BASE and HEAD commits are the same. TruffleHog won't scan
          # anything." Every scheduled run since this workflow was added failed
          # that way, reporting failure while covering zero commits.
          path: ./
          # The `version:` input, not the SHA above it, selects the binary that
          # actually scans: the action runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}` and the input defaults
          # to "latest". This step had no `version:` at all, so the 40-character
          # pin above described the wrapper while the scanner floated to whatever
          # ghcr.io published most recently -- the gate could change behaviour
          # with no commit here, and did elsewhere in this portfolio. Pinned to
          # the release the ref already names. Dependabot rewrites `uses:` and
          # never a `with:` input, so the two drift apart on every bump;
          # tests/secret-scan-workflow.test.mjs fails the build when they do.
          version: "3.97.1"
          # `--no-update` is not passed. The action's own command already
          # includes it, and repeating a flag is a hard CLI error
          # ("flag 'no-update' cannot be repeated"). Same for `--fail`.
          #
          # `--results=verified,unknown,unverified` is load-bearing; the old
          # `--results=verified` could not fail on the case this job exists for.
          # TruffleHog sorts a finding into three tiers: `verified` (it
          # authenticated the credential against the live service), `unknown`
          # (verification errored out), and `unverified` (it asked, and the
          # service said no). A credential that leaked and was then REVOKED --
          # the normal end state of a real leak, and precisely what a scheduled
          # full-history sweep is for -- answers "no", so it lands in
          # `unverified`. Measured 2026-09-06 on a throwaway clone of this
          # repository at 3.97.1, with a real-shaped AWS key planted in one
          # commit and deleted in the next (confirmed present in history and
          # absent at HEAD before each run):
          #
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # `--only-verified` is the same hole under a different name, and so is
          # `--results=verified,unknown`.
          #
          # The usual argument for dropping the tier is committed placeholder
          # fixtures. That was measured rather than assumed: this repository's
          # full history (1,431 chunks, 2.2 MB) reports 0 findings under the
          # widened tier, so widening costs nothing here and needs no allowlist.
          # If a placeholder ever does fire, exclude that detector by name; do
          # not widen the hole back to a whole tier.
          extra_args: --results=verified,unknown,unverified
