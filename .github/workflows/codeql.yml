# Static analysis (SAST) for the application code and the workflow YAML.
# `javascript-typescript` covers the Next.js app, data scripts, and tests;
# `actions` scans the workflow files themselves — a separate query surface.
name: codeql

on:
  # No push: trigger. CI-CD-STANDARD.md 11e — the pull_request run below
  # already analyzed this exact commit, so re-running CodeQL on the merge
  # to main pays for the same analysis twice. The weekly schedule keeps the
  # default-branch alert baseline fresh when no PR has landed.
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            queries: security-extended
          - language: actions
            queries: "" # security-extended is not a published suite for `actions`; use defaults
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
