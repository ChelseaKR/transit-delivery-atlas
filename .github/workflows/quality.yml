name: Quality

# `docs/**` and `**.md` are deliberately NOT ignored. Three committed tests grade
# documentation against the data it describes -- tests/accessibility-scope.test.mjs
# reads docs/ACCESSIBILITY.md, and tests/published-figures.test.mjs reads
# docs/RELATIONSHIP-MODEL.md and docs/BRAND.md -- so ignoring those paths meant the
# only tests that can catch doc drift were the ones no documentation change could
# ever run. The failure did not disappear; it moved to `main`, where deploy.yml has
# no paths filter and `deploy` needs `verify`, so a doc edit that breaks a
# doc-derived test merged green and then stopped the site deploying.
on:
  pull_request:
    paths-ignore: ['LICENSE']
  push:
    branches: [main]
    paths-ignore: ['LICENSE']

permissions:
  contents: read

concurrency:
  # The group key must distinguish one push to main from the next. Keyed on the ref
  # alone, every push to `main` shares one group, so with `cancel-in-progress: true`
  # each merge cancels the run its predecessor was still executing. Measured on
  # 2026-09-06: `afb757e2` (#116) and `0b9b1ada` (#119) sit on `main` with `validate`
  # recorded as `cancelled` and nothing else — no gate returned a verdict on either,
  # and the branch read as green because the tip's run was the survivor. Appending the
  # SHA gives each push its own group; pull requests keep collapsing onto the branch
  # ref, which is the cancellation that is actually wanted.
  group: quality-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      # `npm run check` above now runs this first, before the build can rewrite
      # anything. Kept as its own step so a stale export is named in the job log
      # rather than found inside a long gate, and written as the check rather than
      # a regenerate-and-diff: `git diff --exit-code` cannot see an export that was
      # never committed at all.
      - name: Verify generated exports are committed
        run: npm run data:export:check
