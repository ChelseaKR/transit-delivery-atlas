name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run release checks
        run: npm run check
        env:
          BUILD_SHA: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload static release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://transit.chelseakr.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Download static release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out

      # Runs before anything is uploaded, so a truncated, stale or partially
      # exported artifact cannot reach production. Every count is derived from
      # the canonical records in data/, so a legitimate editorial change - a
      # sixth watchlist item, a new source-role link - passes instead of failing
      # a correct publish.
      - name: Verify the built artifact against the canonical data
        run: node scripts/verify-release-artifact.mjs --artifact out --expect-sha "${{ github.sha }}"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload immutable Next.js assets
        run: |
          aws s3 sync out/_next/static/ "s3://${{ vars.S3_BUCKET }}/_next/static/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload mutable pages, data, and media
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront and wait
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$invalidation_id"

      # This runs after the release is live. It can only report, never revert:
      # a failure here means the new content is already being served and is
      # suspect. Roll back by re-running this workflow at the last good commit.
      # Anything that must be able to stop a publish belongs in the artifact
      # verification step above, not here.
      - name: Smoke the exact CloudFront release
        id: smoke
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN_NAME }}
        run: |
          site_domain="transit.chelseakr.com"
          edge="${site_domain}:443:${CLOUDFRONT_DOMAIN}:443"
          curl_edge() {
            curl --fail --silent --show-error --location --compressed \
              --connect-to "$edge" "$@"
          }

          deployed_sha=$(curl_edge "https://${site_domain}/version.json" | jq -r '.sha')
          test "$deployed_sha" = "$EXPECTED_SHA"

          for route in / /handoffs/ /evidence/ /watchlist/ /research/tda-ntd/ /corrections/ /methodology/ /data/ /accessibility/ /directives/n-7-26-5/; do
            curl_edge "https://${site_domain}${route}" > /dev/null
          done

          curl_edge "https://${site_domain}/" > /tmp/home.html
          grep -Fq 'Directive register' /tmp/home.html

          curl_edge "https://${site_domain}/evidence/" > /tmp/evidence.html
          grep -Fq 'Reviewed public evidence' /tmp/evidence.html
          grep -Fq 'https://chelseakr.com/writing/signed-transit-order-start' /tmp/evidence.html

          curl_edge "https://${site_domain}/watchlist/" > /tmp/watchlist.html
          grep -Fq 'Public developments under review' /tmp/watchlist.html
          grep -Fq 'Context only · Not implementation evidence' /tmp/watchlist.html

          curl_edge "https://${site_domain}/handoffs/" > /tmp/handoffs.html
          grep -Fq 'Delivery relationships' /tmp/handoffs.html
          grep -Fq 'Explicit source-role links' /tmp/handoffs.html
          grep -Fq 'A relationship is not a status.' /tmp/handoffs.html

          curl_edge "https://${site_domain}/research/tda-ntd/" > /tmp/research.html
          grep -Fq 'Four fields. One honest automation boundary.' /tmp/research.html
          grep -Fq 'Automate preparation, not accountability.' /tmp/research.html
          grep -Fq 'Share research feedback' /tmp/research.html

          curl_edge "https://${site_domain}/corrections/" > /tmp/corrections.html
          grep -Fq 'Challenge the record, with a source.' /tmp/corrections.html
          grep -Fq '01-content-correction.yml' /tmp/corrections.html
          grep -Fq '02-review-feedback.yml' /tmp/corrections.html

          curl_edge "https://${site_domain}/directives/n-7-26-5/" > /tmp/directive.html
          grep -Fq 'Transit Executive Order N-7-26 Resource Material' /tmp/directive.html

          # Every published file must be byte-identical to the artifact this run
          # built and verified. That is the property this step is actually for -
          # did the bytes I built land at the edge - and unlike the record counts
          # that used to be asserted here, it survives every legitimate data
          # change. The file list is read from the artifact, so a new export is
          # covered without editing this workflow.
          for built in $(find out/data -type f | sort) out/og.png out/sitemap.xml out/robots.txt; do
            route="${built#out/}"
            curl_edge "https://${site_domain}/${route}" > /tmp/edge-artifact
            if ! cmp -s /tmp/edge-artifact "$built"; then
              echo "::error::${route} at the edge does not match the artifact this run built"
              exit 1
            fi
          done

          status=$(curl --silent --output /tmp/not-found.html --write-out '%{http_code}' \
            --connect-to "$edge" "https://${site_domain}/deploy-smoke-not-found/")
          test "$status" = "404"
          grep -Fq 'This page does not exist.' /tmp/not-found.html

          curl --fail --silent --show-error --head --connect-to "$edge" \
            "https://${site_domain}/" > /tmp/headers.txt
          grep -Eiq '^strict-transport-security:' /tmp/headers.txt
          grep -Eiq '^content-security-policy:' /tmp/headers.txt
          grep -Eiq '^x-content-type-options: *nosniff' /tmp/headers.txt
          grep -Eiq '^x-frame-options: *deny' /tmp/headers.txt
          grep -Eiq '^referrer-policy: *strict-origin-when-cross-origin' /tmp/headers.txt
          grep -Eiq '^permissions-policy:.*camera=\(\)' /tmp/headers.txt

      - name: Explain a failed post-deploy smoke
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          {
            echo "### The smoke check failed after publish"
            echo ""
            echo "The release is **live and suspect**. Nothing rolled back, and nothing in this"
            echo "workflow reverts automatically."
            echo ""
            echo "Record counts and artifact integrity are verified before the upload, so a failure"
            echo "here means the edge is not serving the bytes this run built: check the CloudFront"
            echo "invalidation and the S3 sync before assuming the data is wrong."
            echo ""
            echo "To roll back, re-run this workflow at the last good commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          echo "Deployed $GITHUB_SHA to https://transit.chelseakr.com" >> "$GITHUB_STEP_SUMMARY"
